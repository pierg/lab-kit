<rect class="tick" x="615" y="177" width="10" height="10" transform="rotate(45 620 182)"/>
<text class="mono-soft" x="632" y="172">result</text>
<rect class="tick" x="829" y="177" width="10" height="10" transform="rotate(45 834 182)"/>
<text class="mono-soft" x="822" y="172" text-anchor="end">lesson or kill</text>

<!-- ============ THE GATE ============ -->
<rect class="gate" x="16" y="458" width="868" height="34" rx="8"/>
<text class="lab-lab" x="32" y="480" font-weight="700">lab-kit check</text>
<text class="soft" x="150" y="480">folio check, then every lab check, before anything lands on main</text>
<circle cx="680" cy="475.5" r="4.5" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M680,471 A4.5,4.5 0 0 1 680,480 Z" class="fill-acc"/>
<text class="soft" x="690" y="480">frozen</text>
<circle cx="760" cy="475.5" r="5" class="fill-acc"/>
