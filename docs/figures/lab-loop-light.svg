<rect class="pill" x="652" y="214" width="114" height="20" rx="4"/><text class="pill-t" x="662" y="228">lab-rederive</text>
<rect class="pill" x="652" y="240" width="169" height="20" rx="4"/><text class="pill-t" x="662" y="254">lab-result-grounded</text>

