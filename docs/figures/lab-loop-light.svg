<circle cx="232" cy="104" r="4.5" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M232,99.5 A4.5,4.5 0 0 1 232,108.5 Z" class="fill-acc"/>

<rect class="node" x="572" y="90" width="96" height="52" rx="7"/>
<text class="name" x="584" y="112">result</text><text class="mono-soft" x="584" y="131">R-n</text>
<circle cx="654" cy="104" r="5" class="fill-acc"/>
<rect class="node" x="690" y="90" width="78" height="52" rx="7"/>
<text class="name" x="702" y="112">claim</text><text class="mono-soft" x="702" y="131">C-n</text>
<rect class="node" x="788" y="90" width="82" height="52" rx="7"/>
<text class="name" x="800" y="121">report</text>
<circle cx="858" cy="104" r="4.5" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M858,99.5 A4.5,4.5 0 0 1 858,108.5 Z" class="fill-acc"/>

<path class="edge" d="M122,116 L145,116" marker-end="url(#ar)"/>
<path class="edge" d="M668,116 L689,116" marker-end="url(#ar)"/>
<path class="edge" d="M768,116 L787,116" marker-end="url(#ar)"/>

<text class="t" x="410" y="112" text-anchor="middle">folio decides</text>
<text class="t" x="410" y="131" text-anchor="middle">what a document is</text>
<!-- the journal, inside the library -->
<text class="mono-soft" x="32" y="186">journal</text>
<path class="tl" d="M100,182 L870,182"/>

<!-- ============ LANE B: LAB FILES ============ -->
<rect class="lane-b" x="212" y="244" width="384" height="200" rx="10"/>
<text class="lab-lab" x="228" y="268" font-weight="700">LAB FILES · LAB-KIT</text>

<rect class="node-b" x="232" y="280" width="170" height="66" rx="7"/>
<text class="name" x="244" y="301">run</text>
<text class="mono" x="244" y="321" style="font-size:13px">run.json</text>
<text class="mono" x="244" y="339" style="font-size:13px">out/ sealed</text>
