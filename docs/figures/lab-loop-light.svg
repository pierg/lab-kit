<rect class="pill" x="428" y="356" width="150" height="20" rx="4"/><text class="pill-t" x="438" y="370">lab-score-exact</text>

<text class="t" x="503" y="400" text-anchor="middle" style="fill:var(--lab)">lab-kit decides</text>
<text class="t" x="503" y="419" text-anchor="middle" style="fill:var(--lab)">when a result counts</text>
<path class="e-lab" d="M402,313 L427,313" marker-end="url(#ar-lab)"/>

