[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
dynamic = ["readme"]
name = "lab-kit-cli"
version = "0.1.0"
description = "A research lab's method and machinery on top of folio: pre-register, lock, run, score, re-derive."
license = "MIT"
authors = [{ name = "Piergiuseppe Mallozzi" }]
requires-python = ">=3.10"
dependencies = ["folio-kb>=0.1.0", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/pierg/lab-kit"
Issues = "https://github.com/pierg/lab-kit/issues"

[project.scripts]
lab-kit = "lab_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_kit"]

# The method, the skills and the agent roles ship inside the package; lab-kit
# finds them there when installed, and in the checkout when run from source.
[tool.hatch.build.targets.wheel.force-include]
"method" = "lab_kit/_data/method"
"skills" = "lab_kit/_data/skills"
"agents" = "lab_kit/_data/agents"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI shows the README outside the repository, so relative links point at GitHub there.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?:)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/pierg/lab-kit/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?!https?:|#)([^)]+)\)'
replacement = '[\1](https://github.com/pierg/lab-kit/blob/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?:)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/pierg/lab-kit/main/\2"'
