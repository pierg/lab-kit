name: release

# Publishes lab-kit to PyPI through trusted publishing: no token is stored anywhere.
# One-time setup on pypi.org: Account, Publishing, add a publisher for
#   project lab-kit-cli, owner pierg, repository lab-kit, workflow release.yml, environment pypi.
# Run it by hand from the Actions tab. Pushing a tag does not publish; publishing pushes the tag
# v<version> and a GitHub release with that version's changelog section.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git for the tests' temporary repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      # Never publish untested: the same gate CI runs, against folio-kb from PyPI.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Example lab
        working-directory: examples/monte-carlo-lab
        run: lab-kit check
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      # The tag and the GitHub release follow what was published, with the changelog's section.
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: lab-kit
        run: |
          v=$(ls dist/*.whl | head -1 | sed -E 's|^dist/[^-]+-([^-]+)-.*|\1|')
          awk -v v="$v" '/^## /{ if (on) exit; if ($2 == v || $2 == "v" v) { on = 1; next } } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "$NAME $v" --notes-file notes.md
